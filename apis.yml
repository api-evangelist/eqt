aid: eqt
name: EQT
description: >-
  EQT Corporation is the largest producer of natural gas in the United States,
  headquartered in Pittsburgh, Pennsylvania. It is a vertically integrated
  Appalachian Basin operator: upstream exploration and production, plus the
  interstate gathering and transmission pipelines it acquired with Equitrans
  Midstream in July 2024. EQT pairs production technology with environmental
  stewardship commitments, including a Scope 1 and Scope 2 net-zero target it
  reports as met ahead of its 2025 goal. EQT runs no developer program and
  publishes no API. Its only machine-readable public documents are the OpenID
  Connect discovery metadata of two Salesforce customer portals — infopost.eqt.com,
  the FERC-mandated Informational Postings site for its interstate pipelines, and
  customers.equitransmidstream.com — whose posting data renders client-side and is
  otherwise gated to registered customers. Not the Swedish firm EQT AB.
